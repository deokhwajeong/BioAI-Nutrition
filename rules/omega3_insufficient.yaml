id: omega3_insufficient
when:
  cond_omega3: "daily_features.omega3_g < user_targets.omega3_g * 0.7"
then:
  message: "Omega-3 intake looks low today. Fatty fish (salmon, mackerel), walnuts, or ground flaxseed are common sources to consider for tomorrow."
  rationale: "Intake is under 70% of your omega-3 target (default 1.6 g/day, a common dietary reference value)."
  priority: low
  guardrails: ["non-diagnostic", "allergen-aware"]
