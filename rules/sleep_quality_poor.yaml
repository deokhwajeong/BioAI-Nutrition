id: sleep_quality_poor
when:
  cond_sleep: "daily_features.sleep_hours < 6.5"
then:
  message: "Sleep was under 6.5 hours. An earlier bedtime and fewer screens in the last hour before bed may help tonight."
  rationale: "Short sleep is associated with stronger appetite and less stable glucose the next day."
  priority: high
  guardrails: ["non-diagnostic"]
