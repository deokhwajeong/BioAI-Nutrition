id: protein_intake_low
when:
  cond_protein: "daily_features.protein_g < user_targets.protein_g * 0.8"
then:
  message: "Protein intake is below target. A palm-sized serving of chicken, fish, legumes, or Greek yogurt at your next meal would help."
  rationale: "Today's protein intake is under 80% of your personal target."
  priority: medium
  guardrails: ["non-diagnostic", "allergen-aware"]
