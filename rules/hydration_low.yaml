id: hydration_low
when:
  cond_water: "daily_features.water_ml < 1500"
then:
  message: "Water intake is below 1.5 L today. Keeping a bottle nearby and drinking a glass every hour or so is an easy way to catch up."
  rationale: "Mild dehydration can affect concentration and is sometimes mistaken for hunger."
  priority: medium
  guardrails: ["non-diagnostic"]
