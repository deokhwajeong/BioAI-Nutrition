id: calorie_surplus_moderate
when:
  cond_calories: "daily_features.calories > user_targets.calories * 1.15"
then:
  message: "Calorie intake is more than 15% above your daily target. For your next meal, a protein and vegetable-heavy option with fewer added fats or refined carbs would bring the day closer to target."
  rationale: "Intake that stays well above a personal target over many days tends to lead to gradual weight gain."
  priority: medium
  guardrails: ["non-diagnostic"]
