id: high_glycemic_load_alert
when:
  cond_sugar: "daily_features.sugar_g > 50"
  cond_fiber: "daily_features.fiber_g < 15"
then:
  message: "Sugar is high and fiber is low today. Pairing carbohydrate-rich foods with fiber, protein, or fat tends to soften the glucose rise after a meal."
  rationale: "Fiber slows how quickly sugar is absorbed, so high-sugar, low-fiber meals tend to produce sharper glucose rises."
  priority: medium
  guardrails: ["non-diagnostic"]
