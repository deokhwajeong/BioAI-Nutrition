id: fiber_boost_simple
when:
  cond_fiber: "daily_features.fiber_g < user_targets.fiber_g * 0.8"
then:
  message: "Fiber is below target today. Adding 6 to 8 g, for example an apple and a handful of almonds, would close most of the gap."
  rationale: "Today's fiber intake is under 80% of your target."
  priority: low
  guardrails: ["non-diagnostic", "allergen-aware"]
