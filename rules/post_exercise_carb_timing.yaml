id: post_exercise_carb_timing
when:
  cond_steps: "daily_features.steps > 8000"
  cond_carbs: "daily_features.carbs_g < 100"
then:
  message: "You have been active today but carbohydrate intake is low. A carbohydrate-containing snack after activity helps refuel."
  rationale: "Carbohydrate eaten after exercise helps restore the glycogen used during activity."
  priority: medium
  guardrails: ["non-diagnostic"]
