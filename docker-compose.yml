# One-command local stack: `docker compose up --build`, then open http://localhost:3000
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_KEY: ${API_KEY:-dev-api-key}
      HASH_PEPPER: ${HASH_PEPPER:-dev-pepper}
    volumes:
      - api-data:/srv/data
    ports:
      - "8000:8000"

  web:
    build:
      context: apps/web
      args:
        BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  api-data:
