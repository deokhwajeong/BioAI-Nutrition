[project]
name = "nutri-node-api"
version = "0.2.0"
description = "Nutri-Node API: privacy-preserving, lag-compensated biomarker fusion for personalized nutrition."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "celery>=5.4",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/engine/patent_classifications.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are handled by the formatter where possible
    "B008",   # FastAPI uses calls in argument defaults (Depends, Query, File)
    "B904",   # HTTPException re-raises intentionally hide internal tracebacks
    "B905",   # zip() over equal-length series; strict= adds noise here
    "B007",
    "UP042",  # str+Enum kept for JSON/OpenAPI compatibility
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"app/routers/*.py" = ["E402"]
"tests/**" = ["E402", "F841"]
